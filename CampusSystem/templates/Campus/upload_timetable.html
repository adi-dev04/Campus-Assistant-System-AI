{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Upload Timetable</title>
    <link rel="stylesheet" href="{% static 'css/style5.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <header class="tt-header">
        <h1>Upload Timetable</h1>
    </header>

    <div class="tt-container">

        <form method="POST"
              action="{% url 'upload_timetable' %}"
              enctype="multipart/form-data">

            {% csrf_token %}

            <label>Timetable Title</label><br>
            <input type="text" name="title" required><br>

            <label>Select PDF</label><br>
            <input type="file" name="file" accept=".pdf" required><br>

            <button type="submit">Upload Timetable</button>

        </form>

    </div>

</body>
</html>
